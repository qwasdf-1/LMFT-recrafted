name: Publishing manifest checks

on:
  push:
    branches: [main, work/release-publishing]
    paths:
      - 'release/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'README.md'
      - 'docs/publishing.md'
      - '.github/workflows/credentials-preflight.yml'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/modrinth.yml'
      - '.github/workflows/curseforge.yml'
      - '.github/workflows/publishing-checks.yml'
  pull_request:
    paths:
      - 'release/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'README.md'
      - 'docs/publishing.md'
      - '.github/workflows/credentials-preflight.yml'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/modrinth.yml'
      - '.github/workflows/curseforge.yml'
      - '.github/workflows/publishing-checks.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tagged release contract
        run: |
          set -euo pipefail
          python3 -m unittest discover -s release/tests -v
          python3 release/manifest.py notes >/dev/null
          python3 release/manifest.py games
      - name: Parse publishing workflow YAML files
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for name in ('release.yml', 'modrinth.yml', 'curseforge.yml', 'publishing-checks.yml'):
              data = yaml.safe_load((Path('.github/workflows') / name).read_text())
              assert isinstance(data, dict) and 'jobs' in data, name
              print('Parsed', name)
          PY

  candidate-binaries:
    needs: contracts
    runs-on: ubuntu-latest
    name: "Dry-run release JAR (${{ matrix.loader }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, gradle: '9.8.2' }
          - { loader: neoforge, gradle: '9.2.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build and validate universal release candidate without uploading
        shell: bash
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          version="$(python3 release/manifest.py version)"
          args=("-Pmod_version=$version+26.x")
          if [[ "$LOADER" == fabric ]]; then
            args+=("-Pminecraft_range=>=26.1 <26.4")
          else
            args+=("-Pminecraft_range=[26.1,26.4)" "-Pneoforge_range=[26.1.0.19-beta,)")
          fi
          gradle -p "modern/26.3/$LOADER" clean build "${args[@]}" --console=plain
          python3 release/manifest.py stage --loader "$LOADER" \
            --build-dir "modern/26.3/$LOADER/build/libs"
          jar="$(python3 release/manifest.py file --loader "$LOADER")"
          unzip -t "dist/$jar" >/dev/null
          for notice in META-INF/LICENSE META-INF/NOTICE META-INF/licenses/CC0-1.0.txt; do
            unzip -p "dist/$jar" "$notice" > "$RUNNER_TEMP/$(basename "$notice")" || {
              echo "Missing bundled license/notice $notice" >&2
              exit 1
            }
          done
          if [[ "$LOADER" == fabric ]]; then
            unzip -p "dist/$jar" fabric.mod.json > "$RUNNER_TEMP/metadata.json"
            python3 - "$RUNNER_TEMP/metadata.json" "$version" <<'PY'
          import json,sys
          metadata=json.load(open(sys.argv[1]))
          assert metadata["id"] == "lmft"
          assert metadata["version"] == sys.argv[2] + "+26.x"
          assert metadata["depends"]["minecraft"] == ">=26.1 <26.4"
          assert metadata["license"] == "Apache-2.0"
          PY
          else
            unzip -p "dist/$jar" META-INF/neoforge.mods.toml > "$RUNNER_TEMP/metadata.toml"
            python3 - "$RUNNER_TEMP/metadata.toml" "$version" <<'PY'
          import sys,tomllib
          with open(sys.argv[1],"rb") as source:
              metadata=tomllib.load(source)
          assert metadata["mods"][0]["modId"] == "lmft"
          assert metadata["mods"][0]["version"] == sys.argv[2] + "+26.x"
          assert metadata["license"] == "Apache-2.0"
          dependencies={item["modId"]:item for item in metadata["dependencies"]["lmft"]}
          assert dependencies["minecraft"]["versionRange"] == "[26.1,26.4)"
          PY
          fi
          echo "Release candidate $jar metadata verified; no publish performed"
