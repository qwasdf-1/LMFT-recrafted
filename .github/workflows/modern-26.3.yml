name: Minecraft 26.3

on:
  push:
    branches:
      - work/multiversion-support
      - main
      - 26.x
  pull_request:

permissions:
  contents: read

jobs:
  recovery-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test loader-independent recovery logic
        shell: bash
        run: |
          set -euo pipefail
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          javac -d "$temp_dir" \
            modern/26.3/common/src/main/java/io/wispforest/lmft/TagRecovery.java \
            modern/26.3/tests/TagRecoveryTest.java
          java -cp "$temp_dir" io.wispforest.lmft.TagRecoveryTest
      - name: Validate tag test fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('modern/26.3/testdata').rglob('*.json'):
              json.loads(path.read_text())
          json.loads(Path('modern/26.3/testdata/pack.mcmeta').read_text())
          print('All 26.3 test fixture JSON parses')
          PY

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build Fabric 26.3
        run: gradle -p modern/26.3/fabric build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lmft-fabric-26.3
          path: modern/26.3/fabric/build/libs/*.jar

  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge 26.3
        run: gradle -p modern/26.3/neoforge build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lmft-neoforge-26.3
          path: modern/26.3/neoforge/build/libs/*.jar


  server-smoke:
    name: "Dedicated server smoke (${{ matrix.loader }})"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            gradle: '9.8.2'
          - loader: neoforge
            gradle: '9.2.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Prepare test world with required missing entries
        shell: bash
        run: |
          set -euo pipefail
          mod_dir="modern/26.3/${{ matrix.loader }}"
          mkdir -p "$mod_dir/run/world/datapacks/lmft-recovery-test"
          cp -R modern/26.3/testdata/. "$mod_dir/run/world/datapacks/lmft-recovery-test/"
          printf 'eula=true\n' > "$mod_dir/run/eula.txt"
          printf 'level-name=world\nonline-mode=false\nmax-tick-time=-1\nenable-rcon=true\nrcon.port=25575\nrcon.password=lmft_ci_only\n' > "$mod_dir/run/server.properties"
      - name: Start server and assert actual tag membership and reloads
        shell: bash
        run: |
          set -euo pipefail
          mod_dir="modern/26.3/${{ matrix.loader }}"
          timeout --signal=TERM --kill-after=15s 330s \
            gradle -p "$mod_dir" runServer --console=plain > "$mod_dir/server-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python3 modern/26.3/tests/server_integration.py \
              --server-log "$mod_dir/server-smoke.log" \
              --datapack "$mod_dir/run/world/datapacks/lmft-recovery-test" \
              --loader "${{ matrix.loader }}"; then
            tail -n 140 "$mod_dir/server-smoke.log"
            exit 1
          fi
          wait "$server_pid"
          grep -q 'Done (' "$mod_dir/server-smoke.log"
          echo "PASS: ${{ matrix.loader }} 26.3 dedicated server integration"
      - name: Upload server output for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmft-server-log-${{ matrix.loader }}
          path: |
            modern/26.3/${{ matrix.loader }}/server-smoke.log
            modern/26.3/${{ matrix.loader }}/run/logs/latest.log
