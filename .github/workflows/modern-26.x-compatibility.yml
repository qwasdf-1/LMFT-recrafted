name: Minecraft 26.x compatibility (experimental)

on:
  push:
    branches: [work/multiversion-support, main, 26.x]
  pull_request:

permissions:
  contents: read

jobs:
  minecraft-compat:
    name: "${{ matrix.loader }} Minecraft ${{ matrix.mc }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, mc: '26.1',   pack: 101, neo: '', gradle: '9.8.2' }
          - { loader: fabric, mc: '26.1.1', pack: 101, neo: '', gradle: '9.8.2' }
          - { loader: fabric, mc: '26.1.2', pack: 101, neo: '', gradle: '9.8.2' }
          - { loader: fabric, mc: '26.2',   pack: 107, neo: '', gradle: '9.8.2' }
          - { loader: neoforge, mc: '26.1',   pack: 101, neo: '26.1.0.19-beta', gradle: '9.2.1' }
          - { loader: neoforge, mc: '26.1.1', pack: 101, neo: '26.1.1.15-beta', gradle: '9.2.1' }
          - { loader: neoforge, mc: '26.1.2', pack: 101, neo: '26.1.2.129', gradle: '9.2.1' }
          - { loader: neoforge, mc: '26.2',   pack: 107, neo: '26.2.0.95', gradle: '9.2.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build a Minecraft-specific artifact
        shell: bash
        run: |
          set -euo pipefail
          mod_dir="modern/26.3/${{ matrix.loader }}"
          args=("-Pminecraft_version=${{ matrix.mc }}" "-Pmod_version=1.2.0-alpha.1+${{ matrix.mc }}")
          if [[ "${{ matrix.loader }}" == "neoforge" ]]; then
            args+=("-Pneo_version=${{ matrix.neo }}")
          fi
          gradle -p "$mod_dir" build "${args[@]}" --console=plain
      - name: Prepare isolated world and a compatible datapack
        shell: bash
        run: |
          set -euo pipefail
          mod_dir="modern/26.3/${{ matrix.loader }}"
          mkdir -p "$mod_dir/run/world/datapacks/lmft-recovery-test"
          cp -R modern/26.3/testdata/. "$mod_dir/run/world/datapacks/lmft-recovery-test/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("modern/26.3/${{ matrix.loader }}/run/world/datapacks/lmft-recovery-test")
          path = root / "pack.mcmeta"
          data = json.loads(path.read_text())
          data["pack"]["min_format"] = ${{ matrix.pack }}
          data["pack"]["max_format"] = ${{ matrix.pack }}
          data["pack"]["description"] = "LMFT ${{ matrix.mc }} recovery test"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          printf 'eula=true\n' > "$mod_dir/run/eula.txt"
          printf 'level-name=world\nonline-mode=false\nmax-tick-time=-1\nenable-rcon=true\nrcon.port=25575\nrcon.password=lmft_ci_only\n' > "$mod_dir/run/server.properties"
      - name: Verify actual tag membership and reload semantics
        shell: bash
        run: |
          set -euo pipefail
          mod_dir="modern/26.3/${{ matrix.loader }}"
          args=("-Pminecraft_version=${{ matrix.mc }}" "-Pmod_version=1.2.0-alpha.1+${{ matrix.mc }}")
          if [[ "${{ matrix.loader }}" == "neoforge" ]]; then
            args+=("-Pneo_version=${{ matrix.neo }}")
          fi
          timeout --signal=TERM --kill-after=15s 330s \
            gradle -p "$mod_dir" runServer "${args[@]}" --console=plain > "$mod_dir/compatibility-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python3 modern/26.3/tests/server_integration.py \
              --server-log "$mod_dir/compatibility-server.log" \
              --datapack "$mod_dir/run/world/datapacks/lmft-recovery-test" \
              --loader "${{ matrix.loader }}"; then
            tail -n 140 "$mod_dir/compatibility-server.log"
            exit 1
          fi
          wait "$server_pid"
          grep -q 'Done (' "$mod_dir/compatibility-server.log"
          echo "PASS: ${{ matrix.loader }} Minecraft ${{ matrix.mc }} tag membership and reloads"
      - name: Save per-version test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "lmft-compat-${{ matrix.loader }}-${{ matrix.mc }}"
          path: |
            modern/26.3/${{ matrix.loader }}/compatibility-server.log
            modern/26.3/${{ matrix.loader }}/run/logs/latest.log
      - name: Save successful per-version jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "lmft-jar-${{ matrix.loader }}-${{ matrix.mc }}"
          path: modern/26.3/${{ matrix.loader }}/build/libs/*.jar
