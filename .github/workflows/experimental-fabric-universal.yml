name: Experimental single-JAR Fabric 26.x cross-load

on:
  push:
    branches: [work/multiversion-support]
    paths:
      - '.github/workflows/experimental-fabric-universal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile once against Minecraft 26.3
        run: gradle -p modern/26.3/fabric build --console=plain
      - name: Produce isolated universal metadata experiment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          jars = [
              p for p in Path("modern/26.3/fabric/build/libs").glob("*.jar")
              if not p.name.endswith("-sources.jar")
          ]
          assert len(jars) == 1, jars
          with ZipFile(jars[0]) as source, ZipFile("fabric-universal-candidate.jar", "w") as output:
              for info in source.infolist():
                  data = source.read(info.filename)
                  if info.filename == "fabric.mod.json":
                      metadata = json.loads(data)
                      metadata["version"] = "1.2.0-alpha.1+26.x-universal-test"
                      metadata["depends"]["minecraft"] = ">=26.1 <26.4"
                      data = (json.dumps(metadata, indent=2) + "\n").encode()
                  output.writestr(info, data)
          print("Single Fabric 26.3-compiled candidate prepared (test metadata only)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-universal-candidate
          path: fabric-universal-candidate.jar

  cross-load:
    needs: candidate
    name: "One compiled Fabric JAR on Minecraft ${{ matrix.mc }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.1', pack: 101 }
          - { mc: '26.1.1', pack: 101 }
          - { mc: '26.1.2', pack: 101 }
          - { mc: '26.2', pack: 107 }
          - { mc: '26.3', pack: 121 }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: fabric-universal-candidate
          path: .
      - name: Install a standalone Fabric server for this Minecraft version
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/universal-server"
          mkdir -p "$server_dir" "$server_dir/mods"
          curl --fail --location --retry 3 \
            https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar \
            -o "$server_dir/fabric-installer.jar"
          java -jar "$server_dir/fabric-installer.jar" server \
            -mcversion "${{ matrix.mc }}" -loader 0.20.1 -downloadMinecraft -dir "$server_dir"
          test -f "$server_dir/fabric-server-launch.jar"
          cp fabric-universal-candidate.jar "$server_dir/mods/"
          mkdir -p "$server_dir/world/datapacks/lmft-recovery-test"
          cp -R modern/26.3/testdata/. "$server_dir/world/datapacks/lmft-recovery-test/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("universal-server/world/datapacks/lmft-recovery-test/pack.mcmeta")
          pack = json.loads(path.read_text())
          pack["pack"]["min_format"] = ${{ matrix.pack }}
          pack["pack"]["max_format"] = ${{ matrix.pack }}
          path.write_text(json.dumps(pack, indent=2) + "\n")
          PY
          printf 'eula=true\n' > "$server_dir/eula.txt"
          printf 'level-name=world\nonline-mode=false\nmax-tick-time=-1\nenable-rcon=true\nrcon.port=25575\nrcon.password=lmft_ci_only\n' \
            > "$server_dir/server.properties"
      - name: Test exactly the same Fabric JAR on this release
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/universal-server"
          (
            cd "$server_dir"
            timeout --signal=TERM --kill-after=15s 340s \
              java -Xmx2G -jar fabric-server-launch.jar nogui > server.log 2>&1
          ) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python3 modern/26.3/tests/server_integration.py \
              --server-log "$server_dir/server.log" \
              --datapack "$server_dir/world/datapacks/lmft-recovery-test" \
              --loader fabric; then
            tail -n 180 "$server_dir/server.log"
            exit 1
          fi
          wait "$server_pid"
          grep -q 'Done (' "$server_dir/server.log"
          echo "PASS: identical Fabric JAR on Minecraft ${{ matrix.mc }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "fabric-universal-test-${{ matrix.mc }}"
          path: universal-server/server.log
