name: Verify marketplace credentials (no uploads)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modrinth:
    name: Check Modrinth project (read-only)
    if: vars.MODRINTH_PROJECT_ID != '' || vars.MODRINTH_PROJECT_SLUG != '' || vars.MODRINTH_PROJECT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Modrinth slug and validate project ownership
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_SLUG }}
          MODRINTH_PROJECT_URL: ${{ vars.MODRINTH_PROJECT_URL }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo "MODRINTH_TOKEN is not configured" >&2; exit 1; }
          identifier="$(python3 release/modrinth_project.py lookup \
            --id "$MODRINTH_PROJECT_ID" \
            --slug "$MODRINTH_PROJECT_SLUG" \
            --url "$MODRINTH_PROJECT_URL")"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: qwasdf-1/LMFT-recrafted-github-publisher" \
            "https://api.modrinth.com/v2/project/$identifier" \
            > "$RUNNER_TEMP/project.json"
          canonical="$(python3 release/modrinth_project.py verify \
            --id "$MODRINTH_PROJECT_ID" \
            --slug "$MODRINTH_PROJECT_SLUG" \
            --url "$MODRINTH_PROJECT_URL" \
            --expected-source "https://github.com/$GH_REPO" \
            --project-json "$RUNNER_TEMP/project.json")"
          echo "Modrinth project resolved to canonical ID: $canonical"
          echo "Modrinth project lookup and source ownership validated; no upload attempted." >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved Modrinth project ID: $canonical" >> "$GITHUB_STEP_SUMMARY"

  curseforge:
    name: Check CurseForge token and game versions (read-only)
    if: vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token and supported Minecraft version IDs
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
          CURSEFORGE_ENVIRONMENT: ${{ vars.CURSEFORGE_ENVIRONMENT || 'both' }}
        run: |
          set -euo pipefail
          [[ "$CURSEFORGE_PROJECT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "CURSEFORGE_PROJECT_ID must be numeric" >&2; exit 1;
          }
          [[ "$CURSEFORGE_PROJECT_ID" != "656346" ]] || {
            echo "Refusing original upstream CurseForge project ID" >&2; exit 1;
          }
          test -n "$CURSEFORGE_TOKEN" || { echo "CURSEFORGE_TOKEN is not configured" >&2; exit 1; }
          curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            -H "User-Agent: qwasdf-1/LMFT-recrafted-github-publisher" \
            "https://minecraft.curseforge.com/api/game/versions" \
            > "$RUNNER_TEMP/versions.json"
          for loader in fabric neoforge; do
            python3 release/curseforge_versions.py \
              --versions "$RUNNER_TEMP/versions.json" \
              --loader "$loader" \
              --overrides "$CURSEFORGE_GAME_VERSIONS" \
              --environment "$CURSEFORGE_ENVIRONMENT" > "$RUNNER_TEMP/$loader.json"
            jq -e 'length >= 7' "$RUNNER_TEMP/$loader.json" >/dev/null
          done
          echo "CurseForge token and both-loader version metadata validated; upload permission is not checked until publishing." >> "$GITHUB_STEP_SUMMARY"
